name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "26.13.0"
  NO_COLOR: "1"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: bun run typecheck
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: bun run lint
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: bun run scripts/quality/check-workflows.ts
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
      - run: gitleaks dir . --no-banner --redact
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
      - run: |
          test -s bun.lock
          osv-scanner scan --lockfile=bun.lock
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: bun run build
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Coverage and non-empty unit tests
        run: |
          set -euo pipefail
          bun run test:coverage | tee "$RUNNER_TEMP/l1.log"
          grep -Eq 'Tests[[:space:]]+[1-9][0-9]* passed' "$RUNNER_TEMP/l1.log"
          test -s coverage/lcov.info
          grep -q '^SF:src/calendar.ts$' coverage/lcov.info
          grep -q '^SF:src/i18n.ts$' coverage/lcov.info
          grep -q '^SF:server/api.ts$' coverage/lcov.info
          grep -q '^SF:server/archive.ts$' coverage/lcov.info
          ! grep -Eq 'Tests.*[1-9][0-9]* skipped' "$RUNNER_TEMP/l1.log"
          bun run test:deployment 2>&1 | tee "$RUNNER_TEMP/l1-deploy.log"
          grep -Eq 'tests[[:space:]]+[1-9][0-9]*' "$RUNNER_TEMP/l1-deploy.log"
          grep -Eq 'skipped[[:space:]]+0' "$RUNNER_TEMP/l1-deploy.log"
          grep -Eq 'Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/l1-deploy.log"
          ! grep -Eq 'skipped=[1-9]' "$RUNNER_TEMP/l1-deploy.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Real HTTP with isolated Parquet fixtures
        run: |
          set -euo pipefail
          bun run test:integration | tee "$RUNNER_TEMP/l3.log"
          grep -Eq 'Tests[[:space:]]+[1-9][0-9]* passed' "$RUNNER_TEMP/l3.log"
          ! grep -Eq 'Tests.*[1-9][0-9]* skipped' "$RUNNER_TEMP/l3.log"
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Install Chromium
        timeout-minutes: 5
        run: bunx playwright install --with-deps chromium
      - name: Browser journeys with isolated data
        run: |
          set -euo pipefail
          bun run test:browser | tee "$RUNNER_TEMP/l4.log"
          grep -Eq '[1-9][0-9]* passed' "$RUNNER_TEMP/l4.log"
          ! grep -Eq '[1-9][0-9]* skipped' "$RUNNER_TEMP/l4.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  container-image-e2e:
    name: "Container image E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Build and exercise the image with an isolated archive
        run: |
          set -euo pipefail
          bun run test:container | tee "$RUNNER_TEMP/container.log"
          grep -q '^Container smoke passed:' "$RUNNER_TEMP/container.log"
      - id: revision
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - container-image-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26.13.0"
      - name: Verify all required slots and tested revisions
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/quality/validate-slots.ts
