name: Release

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful main push CI run ID for the exact tested commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: nocoo/base-ci/.github/workflows/deploy-docker.yml@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
    with:
      tailscale: true
      environment: hackernews-on-this-day / production
      source-run-id: ${{ inputs.ci-run-id }}
      required-quality-check: "quality / Z1: Gate"
      images: '[{"image":"ghcr.io/nocoo/hackernews-on-this-day","service":"web"}]'
      deploy-directory: /data/hackernews-on-this-day
      remote-verify-command: |
        python3 - <<'PY'
        import datetime, json, os, re, subprocess, time, urllib.error, urllib.request

        source = os.environ['IMAGE_SHA']
        releases = json.loads(os.environ['RELEASE_IMAGES'])
        if not re.fullmatch(r'[a-f0-9]{40}', source) or len(releases) != 1:
            raise SystemExit('Invalid release manifest')
        release = releases[0]
        if (release.get('service') != 'web'
                or release.get('image') != 'ghcr.io/nocoo/hackernews-on-this-day'
                or release.get('sourceSha') != source
                or not re.fullmatch(r'sha256:[a-f0-9]{64}', release.get('digest', ''))):
            raise SystemExit('Release manifest does not identify the expected image')

        reference = release['image'] + '@' + release['digest']
        image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference], text=True))[0]
        container = json.loads(subprocess.check_output(['docker', 'inspect', 'hntoday-app'], text=True))[0]
        if (container['Config']['Image'] != reference or container['Image'] != image['Id']
                or reference not in image.get('RepoDigests', [])
                or image.get('Config', {}).get('Labels', {}).get('org.opencontainers.image.revision') != source
                or 'APP_REVISION=' + source not in container['Config'].get('Env', [])):
            raise SystemExit('Running container does not match the verified image and revision')
        mounts = [entry for entry in container.get('Mounts', []) if entry.get('Destination') == '/data']
        data = os.path.realpath(os.path.join(os.environ['DEPLOY_DIRECTORY'], 'data'))
        if (len(mounts) != 1 or mounts[0].get('Type') != 'bind' or mounts[0].get('RW') is not False
                or os.path.realpath(mounts[0].get('Source', '')) != data):
            raise SystemExit('Archive must be mounted read-only from the deployment data directory')

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None

        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())

        def request(path):
            with opener.open('http://127.0.0.1:17065' + path, timeout=10) as response:
                return response.status, response.headers, response.read()

        for attempt in range(10):
            try:
                status, headers, body = request('/api/live')
                live = json.loads(body)
                if (status == 200 and headers.get('Cache-Control') == 'no-store'
                        and live.get('status') == 'ok' and live.get('component') == 'hntoday'
                        and live.get('revision') == source):
                    break
            except (OSError, ValueError, urllib.error.URLError):
                pass
            if attempt == 9:
                raise SystemExit('Private liveness did not confirm the expected revision')
            time.sleep(3)

        now = datetime.datetime.now(datetime.timezone.utc)
        status, headers, body = request(f'/api/day?month={now.month}&day={now.day}')
        archive = json.loads(body)
        years = archive.get('years')
        has_story = isinstance(years, list) and any(
            isinstance(year, dict) and isinstance(year.get('stories'), list) and any(
                isinstance(story, dict) and isinstance(story.get('id'), int) and story['id'] > 0
                and isinstance(story.get('title'), str) and bool(story['title'].strip())
                for story in year['stories']
            ) for year in years
        )
        if (status != 200 or headers.get('Cache-Control') != 'no-store'
                or archive.get('month') != now.month or archive.get('day') != now.day
                or not has_story or archive.get('missingYears') != []):
            raise SystemExit('Private archive is unavailable or incomplete')
        status, headers, body = request('/')
        if status != 200 or 'text/html' not in headers.get('Content-Type', '') or b'Hacker News' not in body:
            raise SystemExit('Private homepage check failed')
        print(f"Private acceptance passed: revision {source}, {release['digest']}, {len(archive['years'])} years")
        PY
      verify-command: node scripts/verify-deployment.mjs
      timeout-minutes: 25
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
